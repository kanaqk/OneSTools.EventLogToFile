filebeat.inputs:
  - type: filestream
    id: ones-eventlog
    enabled: true
    # Also read small archived LGP conversions (default fingerprint length is 1024 bytes).
    prospector.scanner.fingerprint.length: 64
    paths:
      - /var/log/1c/*.jsonl
      - /var/log/1c/*/*.jsonl
    parsers:
      - ndjson:
          target: "ones"
          add_error_key: true

processors:
  - timestamp:
      field: ones.DateTime
      layouts:
        - '2006-01-02T15:04:05Z'
        - '2006-01-02T15:04:05.999999999Z'
      test:
        - '2026-10-13T07:15:00Z'

output.elasticsearch:
  hosts: ["http://localhost:9200"]
